# Vendored-source guard, from pedrobtz/r-actions. CLAUDE.md's rule for
# src/vendor/zsv is that upstream sources stay unmodified and every
# adaptation is a patch in tools/patches, applied by tools/update-zsv.sh --
# which rewrites src/vendor/zsv/UPSTREAM with the commit it fetched and the
# patches it applied. That file is this package's manifest, so a pull request
# that changes vendored code without changing it is a hand edit nobody can
# reproduce.
#
# There is no tools/vendor/verify script, so the workflow skips tree
# verification and runs the pull-request half only.

on:
  pull_request:

name: vendor

permissions: read-all

jobs:
  vendor:
    uses: pedrobtz/r-actions/.github/workflows/vendor.yml@v1
    with:
      vendor-dir: src/vendor
      must-update: src/vendor/zsv/UPSTREAM
