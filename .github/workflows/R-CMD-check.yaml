# R CMD check, from the reusable workflow in pedrobtz/r-actions: the GitHub
# runners, plus the R-hub containers built to match CRAN's r-devel Linux
# flavors.
#
# The containers are the reason for the switch. zucsv compiles a bundled C
# parser, and upstream code is written against the compilers upstream tests
# on -- so the diagnostics that arrive first are someone else's. CRAN builds
# those flavors with clang 23 at -std=gnu23 and with GCC 16, both -pedantic;
# ubuntu-latest has neither, and a warning only those compilers emit stays
# invisible until CRAN's incoming pretest reports it.
#
# The default runners matrix has no R-devel Linux row: the containers are
# R-devel on Linux already, on the compilers CRAN actually uses.

on:
  # No `push:`: a pull request already checks its merge with main, and the
  # schedule checks main, skipping a commit it has already checked (r-actions
  # README, "Pushes to main").
  # `labeled`/`unlabeled` so that adding or removing a CI label (`full-ci`,
  # `ci:minimal`, `skip-ci:<workflow>`) reruns it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The full set runs weekly and on demand:
  # `gh workflow run R-CMD-check.yaml --ref main`.
  schedule:
    - cron: "4 20 * * 6"
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Other events
# get a group of their own, so none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    # Decided without a runner; the gate inside repeats it. `ci:minimal` is
    # left out: that label still runs the quick legs (ci.md, Labels).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:r-cmd-check'))
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # Quick on pull requests (Ubuntu R-release and the clang 23 container).
      # Full on the weekly schedule, on a dispatch, and on a pull request
      # labelled `full-ci`.
      profile: auto
      # CRAN's noSuggests and noLD flavours, in the full profile: nothing in
      # Suggests installed, and no long double, which the strtod calibration
      # must then do without (design decision 15).
      nosuggests: true
      nold: true
      # r-actions' default runners, plus Windows on R-devel: CRAN checks
      # Windows on R-devel and nothing else in CI does (the containers are
      # Linux). Runs in the full profile only.
      runners: >-
        [{"os": "macos-latest", "r": "release"},
         {"os": "windows-latest", "r": "release"},
         {"os": "windows-latest", "r": "devel"},
         {"os": "ubuntu-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "oldrel-1"}]
