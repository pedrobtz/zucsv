# R CMD check, from the reusable workflow in pedrobtz/r-actions: the GitHub
# runners, plus the R-hub containers built to match CRAN's r-devel Linux
# flavors.
#
# The containers are the reason for the switch. zucsv compiles a bundled C
# parser, and upstream code is written against the compilers upstream tests
# on -- so the diagnostics that arrive first are someone else's. CRAN builds
# those flavors with clang 23 at -std=gnu23 and with GCC 16, both -pedantic;
# ubuntu-latest has neither, and a warning only those compilers emit stays
# invisible until CRAN's incoming pretest reports it.
#
# The default runners matrix has no R-devel Linux row: the containers are
# R-devel on Linux already, on the compilers CRAN actually uses.

on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
