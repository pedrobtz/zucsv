# Runs the test suite against R-devel built with AddressSanitizer and
# UndefinedBehaviorSanitizer, which is what CRAN runs after acceptance.
# Findings here are release blockers, in vendored code as much as in ours
# (fix those with a patch in tools/patches/).

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

name: sanitizers.yaml

permissions: read-all

jobs:
  san:
    runs-on: ubuntu-latest
    name: rocker/r-devel-san
    container:
      image: rocker/r-devel-san:latest

    steps:
      - uses: actions/checkout@v6

      - name: Install testthat
        run: Rscript -e 'install.packages("testthat", repos = "https://cloud.r-project.org")'

      - name: Install the package
        run: R CMD INSTALL --preclean .

      - name: Run the test suite under ASan/UBSan
        env:
          # Leak detection is the main thing this job adds over a local macOS
          # run, where ASan cannot do it.
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          NOT_CRAN: "true"
        run: |
          cd tests
          Rscript testthat.R 2>&1 | tee san.log
          # The sanitizers report on stderr without failing the process, so
          # the log has to be inspected explicitly.
          if grep -qE "runtime error|AddressSanitizer|LeakSanitizer|SUMMARY: " san.log; then
            echo "::error::sanitizer findings above"
            exit 1
          fi
