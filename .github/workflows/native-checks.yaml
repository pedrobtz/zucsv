# Memory safety, undefined behaviour and PROTECT-stack checks, from the
# reusable workflows in pedrobtz/r-actions, configured as the other zu-
# packages configure them. These are the checks CRAN runs after acceptance
# ("Additional issues"), and the ones zucsv most needs: the package is mostly
# C, holds a FILE * and a parser across R error and interrupt paths, and
# caches SEXPs across allocating calls.
#
# A documentation-only pull request skips every job: the reusable workflows
# classify the changed files themselves, so there is no paths-ignore list.
on:
  # No `push:`: a pull request already checks its merge with main, and the
  # schedule checks main, skipping a commit it has already checked (r-actions
  # README, "Pushes to main").
  # `labeled`/`unlabeled` so that adding or removing a CI label reruns it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The full set runs weekly and on demand:
  # `gh workflow run native-checks.yaml --ref main`.
  schedule:
    - cron: "14 20 * * 6"
  workflow_dispatch:

name: native-checks

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# `profile: auto` goes to the three workflows it changes: quick on a pull
# request skips the ASan containers, valgrind and cran-special; the schedule,
# a dispatch and the `full-ci` label run them. lto and rchk take minutes
# either way and run on every pull request. gctorture has its own caller,
# gctorture.yaml, with step 20 on a schedule. Each job is skipped without a
# runner under the CI labels (ci.md, Labels).
jobs:
  # The guard on the vendored parser: a pull request that changes anything
  # under src/vendor must also change src/vendor/zsv/UPSTREAM, which
  # tools/update-zsv.sh rewrites with the commit it fetched and the patches it
  # applied. That file is this package's manifest, so requiring it to move is
  # what catches a hand edit nobody can reproduce. There is no
  # tools/vendor/verify, so the tree-verification step skips itself.
  vendor:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:vendor'))
    uses: pedrobtz/r-actions/.github/workflows/vendor.yml@v1
    with:
      vendor-dir: src/vendor
      must-update: src/vendor/zsv/UPSTREAM

  # asan: true adds the AddressSanitizer job in the R-hub containers, where R
  # is itself an ASan build. That is the leak detection macOS cannot do, and
  # SS16's cleanup discipline is what most needs it. Full profile only; a
  # pull request runs UBSan.
  sanitizers:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:sanitizers'))
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true
      profile: auto

  # --leak-check=full because R's own --use-valgrind does not set it, so a
  # "definitely lost" total arrives with no stack and cannot be attributed
  # from the artifact. Every resource this package leaks would leak on an
  # error or interrupt path -- the FILE * and the parser, freed by
  # R_UnwindProtect -- and a total with no stack is exactly what would not
  # find that. "possibly lost" stays out of the error kinds: for an embedded
  # R that is mostly the interpreter holding interior pointers into its own
  # allocations. Full profile only.
  valgrind:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:valgrind'))
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      profile: auto
      valgrind-opts: >-
        --leak-check=full
        --show-leak-kinds=definite,indirect
        --errors-for-leak-kinds=definite,indirect

  lto:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:lto'))
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  # Fail on findings rather than leaving the artifact to be read: the package
  # is at zero now, so the next finding is a regression, and a warning nobody
  # opens is not how you learn about it.
  rchk:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:rchk'))
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
    with:
      fail-on-findings: true

  # CRAN's rcnst, rlibro and vnu checks -- the "Additional issues" nothing
  # above reproduces. Full profile only.
  cran-special:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:cran-special'))
    uses: pedrobtz/r-actions/.github/workflows/cran-special.yml@v1
    with:
      profile: auto
