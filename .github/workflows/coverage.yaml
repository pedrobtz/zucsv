on:
  pull_request:
  # Weekly on main rather than on every push to it, and on demand; the badge
  # follows (r-actions README, "Pushes to main").
  schedule:
    - cron: "9 20 * * 6"
  workflow_dispatch:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    # Pinned to a commit, not the v1 tag: this job holds a write token
    # (ci.md, Workflows).
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@ae59a2805e622e9ba0f3e902bc5f39eba33c6670 # v1.45.1
    permissions:
      contents: write
